# --------------------------------------------------------------- intake

- path: /{tenant}/api/parliament/questions
  method: GET
  screen: intake
  upstream: pqa-service /questions
  gate: requirePortalSession
  data_class: tenant-scoped
  attacks: [missing-identity, wrong-tenant, session-replay]
  s1_scope: true

# No session gate. Identity comes from readCallerEmail, which reads
# `callerEmail` from the query string or JSON body and forwards it upstream via
# appendCallerEmailToPath. S1-BE-01's exit criterion is that no client-supplied
# identity is accepted anywhere on the demo path; this route is where that is
# decided. Probed unauthenticated with an invalid body only.
- path: /{tenant}/api/questions
  method: POST
  screen: intake
  upstream: pqa-service /questions
  gate: readCallerEmail
  data_class: tenant-scoped
  attacks: [missing-identity]
  s1_scope: true

# No session gate; mints a presigned S3 URL. credential-class by definition.
- path: /{tenant}/api/files/presigned-url
  method: POST
  screen: intake
  upstream: pqa-service /files/presigned-url
  gate: none
  data_class: credential
  attacks: [missing-identity, wrong-tenant, s3-prefix-escape]
  s1_scope: true

