# S1-QA-01 deliverable (a): demo-path route inventory and data classification.
#
# Scope: routes reachable from the six demo-journey screens named in S1-UX-01 —
# login, dashboard, PQ intake, drafting, review, export. Routes outside that
# journey are listed with s1_scope: false so the wider surface is visible
# without being a commitment this sprint.
#
# data_class describes what the RESPONSE BODY contains, not what the path
# suggests. It is the field that decides which attacks apply and the one
# S1-DO-02 needs for IAM and index scoping.
#
#   public            identical for every caller; no tenant or user data
#   tenant-scoped     one tenant's data; another tenant must never see it
#   department-scoped one division's data; another division must never see it
#   private-source    may carry private external-source content (promote-to-public)
#   credential        contains or accepts a key, token, presigned URL or session
#
# gate is the ACTUAL enforcement point, traced through proxy helpers rather
# than grepped from the route file. "none" means no session is required by the
# BFF. "readCallerEmail" means identity is taken from the query string or
# request body — i.e. supplied by the caller — and forwarded upstream.
#
# NON-DESTRUCTIVE PROBE RULE. The target is shared infrastructure. Write-method
# routes (POST/PUT/PATCH/DELETE that mutate) carry only `missing-identity`,
# because that probe is unauthenticated and a correctly-gated route refuses
# before anything is written. They deliberately do NOT carry wrong-tenant or
# wrong-department, since those require an authenticated call and an
# authenticated write is out of scope. See spec §3 and §9.2.

# ---------------------------------------------------------------- login

- path: /{tenant}/api/tenant-config
  method: GET
  screen: login
  upstream: tenant-config-manager-service (resolve by slug)
  gate: none
  data_class: public
  attacks: [wrong-tenant]
  s1_scope: true

- path: /{tenant}/api/auth/session
  method: GET
  screen: login
  upstream: identity-service /auth/session
  gate: resolveCurrentUserForTenant
  data_class: credential
  attacks: [missing-identity, wrong-tenant, session-replay]
  s1_scope: true

- path: /{tenant}/api/auth/otp/request
  method: POST
  screen: login
  upstream: identity-service /auth/mock/otp/request
  gate: isDevFallbackAvailable
  data_class: credential
  attacks: [wrong-tenant]
  s1_scope: true

- path: /{tenant}/api/auth/otp/verify
  method: POST
  screen: login
  upstream: identity-service /auth/mock/otp/verify
  gate: isDevFallbackAvailable
  data_class: credential
  attacks: [wrong-tenant]
  s1_scope: true

